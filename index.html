<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1015" />
  <title>川西 · 3D 户外地图</title>
</head>
<body>
  <div id="map"></div>

  <header class="topbar">
    <div class="brand glass">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 19h20" />
        <path d="m4 19 6.5-9 4 5.5 2.5-3.5L20 19" />
      </svg>
      <b>川西</b><span>3D 户外地图</span>
    </div>

    <nav class="chips" id="dest" aria-label="快速定位"></nav>

    <div class="actions">
      <button class="icobtn" id="homeBtn" title="回到全球视角" aria-label="回到全球视角">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m12 3 8.5 6.5H3.5L12 3Z" />
          <path d="M6 9.5V19h12V9.5" />
        </svg>
      </button>
      <button class="icobtn" id="drawerToggle" title="图层（H）" aria-label="图层" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m12 3 9 5-9 5-9-5 9-5Z" />
          <path d="m3 13 9 5 9-5" />
        </svg>
      </button>
    </div>
  </header>

  <div class="hud glass" id="hud">
    <div class="hud-row"><span class="k">坐标</span><span class="v dim" id="hudPos">—</span></div>
    <div class="hud-row"><span class="k">海拔</span><span class="v dim" id="hudEle">—</span></div>
    <div class="hud-row"><span class="k">视角</span><span class="v dim" id="hudAlt">—</span></div>
    <div class="hud-row">
      <span class="k">缩放</span><span class="v" id="hudZoom">—</span>
      <span class="fps" id="hudFps"><i></i><span>0</span></span>
    </div>
  </div>

  <aside class="drawer glass hidden" id="drawer" aria-label="图层设置"></aside>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
